name: Deploy to Hosting

# Deploy manual (pestaña Actions > Run workflow) hasta configurar el hosting de
# chatbotia.cl. Antes apuntaba a diseñopaginas.cl/chatbot-ia: actualiza los
# secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD con los del nuevo hosting.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Crear gemini-key.php
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf "<?php return '%s';\n" "$GEMINI_API_KEY" > dist/gemini-key.php
          fi

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./   # la cuenta FTP entra directo a /home/chatboti/public_html
          dangerous-clean-slate: false
          log-level: verbose
